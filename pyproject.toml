[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "vates_core"
version = "0.1.1"
description = "Vates：Rust 量化 + Zstd 的 ComfyUI / NumPy 扩展（.dct）"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.maturin]
module-name = "vates_core"
features = ["python"]
